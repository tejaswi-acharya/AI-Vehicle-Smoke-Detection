<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | SmokAI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <form class="login-card" id="login-form">
    <div class="brand">SmokAI<small>Vehicle emission monitoring</small></div>
    <h2 class="mt">Officer sign in</h2>
    <label>Full name <input id="name" required autocomplete="name" /></label>
    <label>Access PIN <input id="pin" type="password" inputmode="numeric" maxlength="6" required /></label>
    <p class="error" id="error"></p>
    <button type="submit">Sign in →</button>
    <p class="muted" style="font-size:.85rem">Authorized traffic personnel only.</p>
  </form>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
