<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recorded incidents | SmokAI</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content">
      <section class="panel white">
        <div class="panel-head">
          <div><h2>Recorded incidents</h2><p class="muted">Preserved footage, plate recognition, and review history in one place.</p></div>
          <button id="export">⬇ Export report</button>
        </div>
        <div class="filters">
          <select id="range"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="">All time</option></select>
          <input id="search" placeholder="Search by vehicle number..." />
          <select id="camera"><option value="">All cameras</option></select>
          <select id="status">
            <option value="">All statuses</option><option value="pending">Pending</option>
            <option value="needs_inspection">Inspection</option><option value="confirmed">Reviewed</option>
            <option value="rejected">Dismissed</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Footage</th><th>Vehicle / incident</th><th>Camera / location</th><th>Date &amp; time</th><th>AI confidence</th><th>Review status</th><th>Report</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <span class="muted" id="count"></span>
          <div><button class="ghost" id="prev">‹ Previous</button> <button class="ghost" id="next">Next ›</button></div>
        </div>
        <p class="muted" style="font-size:.85rem;margin-top:14px">Reviewed means officer-verified evidence, not an emissions-test result. Reports are restricted to authorized personnel.</p>
      </section>
    </main>
  </div>
  <script type="module" src="../js/pages/recorded.js"></script>
</body>
</html>
